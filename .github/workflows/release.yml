name: Release

# Only a version tag makes a release: git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags: ['v*']

permissions:
  contents: write # to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore the upload key
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - name: Test and build the signed app
        run: ./gradlew testDebugUnitTest bundleRelease assembleRelease
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_TAG: ${{ github.ref_name }}
      - name: Name the files after the version
        run: |
          mkdir out
          cp app/build/outputs/apk/release/app-release.apk "out/harmonia-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/bundle/release/app-release.aab "out/harmonia-$GITHUB_REF_NAME.aab"
      - uses: softprops/action-gh-release@v3
        with:
          files: out/*
          generate_release_notes: true
