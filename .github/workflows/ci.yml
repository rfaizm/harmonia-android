name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25 # gradle/gradle-daemon-jvm.properties asks for JDK 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      # Kept on failure too, so the reason can be read without rerunning.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: reports
          path: app/build/reports/
